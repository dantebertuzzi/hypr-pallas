[General]
# Caminho da imagem de fundo, relativo a esta pasta.
# Deixe vazio para usar o gradiente Catppuccin Mocha.
background=

# Desfoque do wallpaper (0 desliga)
blurRadius=24

# Escurecimento sobre o wallpaper (0.0 - 1.0)
dimOpacity=0.62

# Cor de destaque (borda em foco, seta, sessao ativa)
accent=#89b4fa

# ---------------------------------------------------------------
# Avatar
# ---------------------------------------------------------------

# Recorte da foto do usuario: arch, circle ou square.
# Cada forma e um par de PNGs (<forma>-mask.png e <forma>-outline.png),
# os tres ja acompanham o tema.
avatarShape=arch

# Cor e opacidade do contorno em volta do avatar.
outlineColor=#a6adc8
outlineOpacity=0.70

# ---------------------------------------------------------------
# Idioma e formatos
# ---------------------------------------------------------------
# O tema nasceu em pt-BR e e esse o padrao quando as chaves faltam.
# Para outro idioma, troque o locale e os textos abaixo.

# Locale usado na data (ex.: pt_BR, en_US, de_DE)
locale=pt_BR

# Formatos do relogio e da data (sintaxe de QDateTime)
timeFormat=HH:mm
dateFormat=dddd, d 'de' MMMM

# ---------------------------------------------------------------
# Textos da tela
# ---------------------------------------------------------------

userPlaceholder=usuário
passwordPlaceholder=senha
sessionLabel=Sessão
suspendLabel=Suspender
rebootLabel=Reiniciar
shutdownLabel=Desligar
loginFailedMessage=Falha na autenticação
capsLockWarning=⇪ Caps Lock ativo
